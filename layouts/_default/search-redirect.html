{{ define "main" }}
<header class="page-header"><h1>搜索文章</h1></header>
<p>搜索已移至<a href="{{ "posts/" | relLangURL }}?search">文章页面</a>。</p>
<script>
(() => {
    const target = new URL({{ "posts/" | relLangURL }}, window.location.href);
    const query = new URLSearchParams(window.location.search).get('q');
    if (query) target.searchParams.set('q', query);
    else target.searchParams.set('search', '');
    window.location.replace(target.href);
})();
</script>
{{ end }}
