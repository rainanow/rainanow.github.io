name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      
      - name: Checkout wiki source
        uses: actions/checkout@v4
        with:
          repository: rainanow/wiki
          token: ${{ secrets.WIKI_REPO_TOKEN }}
          path: wiki-source

      - name: Copy wiki into content
        run: |
          mkdir -p content/posts/wiki
          cp -r wiki-source/*.md content/posts/wiki/
          # 生成的 _index.md：wiki 页面照常渲染，但不进入列表 / 搜索索引 / RSS / sitemap
          cat > content/posts/wiki/_index.md <<'EOF'
          ---
          title: 'wiki'
          build:
            render: always
            list: never
          cascade:
            build:
              render: always
              list: never
            searchHidden: true
            sitemap:
              disable: true
          ---
          EOF
          ls -la content/posts/wiki/

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      
      - name: Encrypt wiki
        run: |
          npm install -g staticrypt
          if [ ! -d public/posts/wiki ]; then
            echo "::error::Hugo did not generate public/posts/wiki"
            ls -la public/posts || true
            exit 1
          fi
          ls -la public/posts/wiki
          staticrypt public/posts/wiki -r -p "${{ secrets.WIKI_PASSWORD }}" --short
          if [ ! -d encrypted ]; then
            echo "::error::staticrypt did not create the encrypted/ output dir"
            exit 1
          fi
          ls -la encrypted
          # staticrypt output layout is encrypted/<input dir name>/..., merge it back
          cp -r encrypted/*/. public/posts/wiki/
          rm -rf encrypted
          if grep -rL --include='*.html' 'staticrypt' public/posts/wiki | grep -q .; then
            echo "::error::these pages are not encrypted:"
            grep -rL --include='*.html' 'staticrypt' public/posts/wiki
            exit 1
          fi
          ls -la public/posts/wiki

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
